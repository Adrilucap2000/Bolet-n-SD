<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Departamento de Salud Digital</title>

    <style>

        /* ==============================
           CONFIGURACIÓN GENERAL
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: white;
        }


        /* ==============================
           BARRA SUPERIOR
        ============================== */

        .barra-superior {
            width: 100%;
            height: 86px;

            background: #0B416D;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 55px;

            position: relative;
            z-index: 1000;
        }


        /* ==============================
           LOGOTIPO
        ============================== */

        .logo {
            display: flex;
            align-items: center;

            height: 100%;
        }

        .logo img {
            height: 58px;
            width: auto;

            object-fit: contain;
        }


        /* ==============================
           MENÚ
        ============================== */

        .menu {
            display: flex;
            align-items: center;

            gap: 38px;

            height: 100%;
        }

        .menu a,
        .menu-boton {
            color: white;

            text-decoration: none;

            font-size: 16px;

            font-weight: 600;

            white-space: nowrap;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .menu a:hover,
        .menu-boton:hover {
            color: #D5B000;
        }


        /* ==============================
           MENÚ DESPLEGABLE
        ============================== */

        .dropdown {
            position: relative;

            height: 100%;

            display: flex;
            align-items: center;
        }

        .menu-boton {
            display: flex;
            align-items: center;

            gap: 8px;
        }

        .flecha {
            font-size: 13px;

            transition: transform 0.3s ease;
        }

        .dropdown:hover .flecha {
            transform: rotate(180deg);
        }


        /* SUBMENÚ */

        .submenu {
            position: absolute;

            top: 86px;
            left: -15px;

            min-width: 210px;

            background: white;

            border-top: 3px solid #D5B000;

            box-shadow: 0 8px 20px rgba(0,0,0,0.18);

            display: none;

            flex-direction: column;
        }

        .submenu a {
            color: #0B416D;

            padding: 14px 18px;

            font-size: 14px;

            font-weight: 500;

            transition: 0.2s ease;
        }

        .submenu a:hover {
            background: #f1f4f6;

            color: #0B416D;
        }

        .dropdown:hover .submenu {
            display: flex;
        }


        /* ==============================
           ICONO DE BÚSQUEDA
        ============================== */

        .busqueda {
            width: 21px;
            height: 21px;

            border: 2px solid white;

            border-radius: 50%;

            position: relative;

            cursor: pointer;

            margin-left: 3px;
        }

        .busqueda::after {
            content: "";

            position: absolute;

            width: 9px;
            height: 2px;

            background: white;

            right: -7px;
            bottom: -4px;

            transform: rotate(-48deg);

            border-radius: 2px;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 900px) {

            .barra-superior {
                height: auto;

                min-height: 75px;

                padding: 12px 25px;

                flex-wrap: wrap;
            }

            .logo img {
                height: 48px;
            }

            .menu {
                width: 100%;

                justify-content: center;

                flex-wrap: wrap;

                gap: 20px;

                padding-top: 12px;
            }

        }


        @media (max-width: 600px) {

            .barra-superior {
                justify-content: center;
            }

            .menu {
                gap: 14px;
            }

            .menu a,
            .menu-boton {
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         BARRA SUPERIOR
    ================================== -->

    <header class="barra-superior">


        <!-- LOGO -->

        <div class="logo">

            <img
                src="logo.png"
                alt="Departamento de Salud Digital"
            >

        </div>


        <!-- MENÚ -->

        <nav class="menu">


            <!-- INICIO -->

            <a href="#">
                Inicio
            </a>


            <!-- DEPARTAMENTO -->

            <div class="dropdown">

                <div class="menu-boton">

                    Departamento

                    <span class="flecha">
                        ▾
                    </span>

                </div>


                <div class="submenu">

                    <a href="#">
                        ¿Quiénes somos?
                    </a>

                    <a href="#">
                        Misión y visión
                    </a>

                    <a href="#">
                        Personal
                    </a>

                    <a href="#">
                        Contacto
                    </a>

                </div>

            </div>


            <!-- ALUMNOS -->

            <div class="dropdown">

                <div class="menu-boton">

                    Alumnos

                    <span class="flecha">
                        ▾
                    </span>

                </div>


                <div class="submenu">

                    <a href="#">
                        Cursos
                    </a>

                    <a href="#">
                        Aula virtual
                    </a>

                    <a href="#">
                        Recursos
                    </a>

                    <a href="#">
                        Actividades
                    </a>

                </div>

            </div>


            <!-- INVESTIGACIÓN -->

            <div class="dropdown">

                <div class="menu-boton">

                    Investigación

                    <span class="flecha">
                        ▾
                    </span>

                </div>


                <div class="submenu">

                    <a href="#">
                        Proyectos
                    </a>

                    <a href="#">
                        Publicaciones
                    </a>

                    <a href="#">
                        Líneas de investigación
                    </a>

                </div>

            </div>


            <!-- ENDIBA -->

            <a href="#">
                ENDIBA
            </a>


            <!-- BÚSQUEDA -->

            <div class="busqueda"></div>


        </nav>

    </header>


</body>

</html>
